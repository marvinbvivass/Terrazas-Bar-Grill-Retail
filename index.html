<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover deja que la aplicación pinte bajo la barra de estado y
      bajo la barra de gestos de Android; el relleno real lo ponen las variables
      safe-area de index.css. Sin esto, instalada queda una franja muerta arriba.
      maximum-scale=1 evita que el navegador haga zoom al tocar un campo.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terrazas" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <title>Terrazas Bar Grill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
